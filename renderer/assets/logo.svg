<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8bff"/>
      <stop offset="0.55" stop-color="#5a5cf0"/>
      <stop offset="1" stop-color="#7a3cf0"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121729"/>
      <stop offset="1" stop-color="#0b0e1a"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ff0c4"/>
      <stop offset="1" stop-color="#38c8ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a0b4d" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Uygulama karesi -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shine)"/>

  <!-- Terminal ekranı -->
  <g filter="url(#soft)">
    <rect x="84" y="108" width="344" height="296" rx="44" fill="url(#screen)"/>
    <circle cx="128" cy="148" r="11" fill="#ff6b6b"/>
    <circle cx="164" cy="148" r="11" fill="#ffc94d"/>
    <circle cx="200" cy="148" r="11" fill="#4fd98b"/>
  </g>

  <!-- >_ istemi -->
  <path d="M138 226 L206 280 L138 334" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="234" y="316" width="104" height="30" rx="15" fill="url(#cursor)"/>

  <!-- SSH kilidi -->
  <g transform="translate(330 196)">
    <path d="M16 34 V22 a26 26 0 0 1 52 0 V34" fill="none" stroke="#9fb4ff" stroke-width="12" stroke-linecap="round"/>
    <rect x="0" y="32" width="84" height="64" rx="16" fill="#9fb4ff"/>
    <circle cx="42" cy="58" r="9" fill="#121729"/>
    <rect x="38" y="60" width="8" height="18" rx="4" fill="#121729"/>
  </g>
</svg>
