name: Sürüm yayınla

# "v1.2.3" biçiminde bir etiket gönderildiğinde Windows (.exe), macOS (.dmg) ve Linux (.deb, AppImage) kurulum
# dosyalarını derler ve public Muhammed61/termify-releases reposunun Releases bölümüne yükler.
# Kod gizli kalır; kurulu uygulamalar güncellemeleri o repodan alır.
# Gerekli secret: RELEASES_TOKEN (termify-releases için Contents: Read and write).
# Actions sekmesinden elle "Run workflow" denirse sadece derlenir, yayınlanmaz (deneme için).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Etiket ve package.json sürümü aynı mı?
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Etiket $GITHUB_REF_NAME ile package.json sürümü $v uyuşmuyor"; exit 1; }

      - name: RELEASES_TOKEN tanımlı mı?
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          T: ${{ secrets.RELEASES_TOKEN }}
        run: '[ -n "$T" ] || { echo "RELEASES_TOKEN secret eksik (Settings > Secrets and variables > Actions)"; exit 1; }'

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist
            name: windows
          - os: macos-latest
            script: dist:mac
            name: macos
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Kurulum dosyalarını derle
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml

  # Dosyalar GitHub CLI ile tek seferde yüklenir ve her biri kontrol edildikten sonra
  # sürüm yayına alınır. Derlemelerden biri bile başarısız olursa hiçbir şey yayınlanmaz;
  # latest*.yml dosyaları eksik kalırsa kurulu uygulamalar yeni sürümü göremez.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sürüm reposuna yükle ve yayına al
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          repo=Muhammed61/termify-releases
          tag="$GITHUB_REF_NAME"
          v="${tag#v}"
          required=("Termify-Setup-$v.exe" "Termify-Setup-$v.exe.blockmap" "latest.yml"
                    "Termify-$v-arm64.dmg" "Termify-$v-x64.dmg" "Termify-$v-arm64.zip" "Termify-$v-x64.zip" "latest-mac.yml"
                    "Termify-$v-amd64.deb" "Termify-$v-arm64.deb" "Termify-$v-x86_64.AppImage" "Termify-$v-arm64.AppImage"
                    "latest-linux.yml" "latest-linux-arm64.yml")
          for f in "${required[@]}"; do [ -f "dist/$f" ] || { echo "Derlemede eksik dosya: $f"; ls dist; exit 1; }; done
          files=(dist/*)

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$repo" --latest --title "Termify $v" --notes "Termify $v

          **Windows:** Termify-Setup-$v.exe dosyasını indirip çalıştırın. Kurulum dosyası imzasız olduğu için SmartScreen uyarı verebilir: Ek bilgi → Yine de çalıştır.

          **macOS:** Apple Silicon (M1/M2/M3/M4) için Termify-$v-arm64.dmg, Intel Mac için Termify-$v-x64.dmg dosyasını indirin, açın ve Termify'yi Uygulamalar klasörüne sürükleyin. Uygulama Apple sertifikasıyla imzalı olmadığı için ilk açılışta uyarı çıkar: Sistem Ayarları → Gizlilik ve Güvenlik → Yine de Aç. \"Hasarlı\" uyarısı çıkarsa Terminal'de bir kez şunu çalıştırın: xattr -cr /Applications/Termify.app

          **Linux (Kali, Debian, Ubuntu):** Termify-$v-amd64.deb dosyasını indirip şunu çalıştırın: sudo apt install ./Termify-$v-amd64.deb (ARM cihazlar için arm64.deb). Kurulumsuz kullanmak için .AppImage dosyası da var: chmod +x ile çalıştırılabilir yapıp açın (libfuse2 gerekir).

          Kurulu uygulamalar yeni sürümü kendiliğinden bulur."
          fi

          assets=$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')
          echo "Yüklenen dosyalar:"; echo "$assets"
          for f in "${required[@]}"; do
            echo "$assets" | grep -qx "$f" || { echo "Sürümde eksik dosya: $f"; exit 1; }
          done
          gh release edit "$tag" --repo "$repo" --draft=false --latest
